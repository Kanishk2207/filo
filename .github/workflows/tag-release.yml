name: Tag Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  classify:
    name: Classify Tag Channel
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
      tag: ${{ steps.classify.outputs.tag }}
      release_name: ${{ steps.classify.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --no-tags --prune

      - name: Classify by branch ancestry
        id: classify
        run: |
          TAG="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA}"
          HAS_MAIN=false
          HAS_DEVELOP=false

          if git show-ref --verify --quiet refs/remotes/origin/main; then
            HAS_MAIN=true
          fi

          if git show-ref --verify --quiet refs/remotes/origin/develop; then
            HAS_DEVELOP=true
          fi

          # Main has priority: tags on commits already promoted to main are stable.
          if [ "$HAS_MAIN" = true ] && git merge-base --is-ancestor "$COMMIT" "origin/main"; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_name=filo ${TAG}" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_DEVELOP" = true ] && git merge-base --is-ancestor "$COMMIT" "origin/develop"; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_name=filo ${TAG} beta" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag commit is not reachable from origin/main or origin/develop."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  release:
    name: Publish GitHub Release
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - name: Publish stable release
        if: needs.classify.outputs.prerelease == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.classify.outputs.tag }}
          name: ${{ needs.classify.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: false
          make_latest: true

      - name: Publish beta prerelease
        if: needs.classify.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.classify.outputs.tag }}
          name: ${{ needs.classify.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          make_latest: false

  upload-binaries:
    name: Build and Upload Binaries
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # taiki-e installs `cross` automatically for non-native targets,
      # builds the release binary, tars it, writes a .sha256, and uploads
      # both to the GitHub Release for this tag.
      - name: Build and upload binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: filo
          target: ${{ matrix.target }}
          archive: filo-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-deb:
    name: Build and Upload .deb
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb (amd64)
        run: cargo deb

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.classify.outputs.tag }}
          files: target/debian/*.deb
