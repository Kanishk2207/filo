name: Tag Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  classify:
    name: Classify Tag Channel
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
      tag: ${{ steps.classify.outputs.tag }}
      release_name: ${{ steps.classify.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --no-tags --prune

      - name: Classify by branch ancestry
        id: classify
        run: |
          TAG="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA}"
          HAS_MAIN=false
          HAS_DEVELOP=false

          if git show-ref --verify --quiet refs/remotes/origin/main; then
            HAS_MAIN=true
          fi

          if git show-ref --verify --quiet refs/remotes/origin/develop; then
            HAS_DEVELOP=true
          fi

          # Main has priority: tags on commits already promoted to main are stable.
          if [ "$HAS_MAIN" = true ] && git merge-base --is-ancestor "$COMMIT" "origin/main"; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_name=filo ${TAG}" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_DEVELOP" = true ] && git merge-base --is-ancestor "$COMMIT" "origin/develop"; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_name=filo ${TAG} beta" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag commit is not reachable from origin/main or origin/develop."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  release:
    name: Publish GitHub Release
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - name: Publish stable release
        if: needs.classify.outputs.prerelease == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.classify.outputs.tag }}
          name: ${{ needs.classify.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: false
          make_latest: true

      - name: Publish beta prerelease
        if: needs.classify.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.classify.outputs.tag }}
          name: ${{ needs.classify.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          make_latest: false

  upload-binaries:
    name: Build and Upload Binaries
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # taiki-e installs `cross` automatically for non-native targets,
      # builds the release binary, tars it, writes a .sha256, and uploads
      # both to the GitHub Release for this tag.
      - name: Build and upload binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: filo
          target: ${{ matrix.target }}
          archive: filo-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-deb:
    name: Build and Upload .deb
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb (amd64)
        run: cargo deb

      # A version-less copy so the README can link a permanent download URL:
      # https://github.com/.../releases/latest/download/filo-amd64.deb
      - name: Create stable-named alias
        run: cp target/debian/*_amd64.deb target/debian/filo-amd64.deb

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.classify.outputs.tag }}
          files: |
            target/debian/*_amd64.deb
            target/debian/filo-amd64.deb

  bump-homebrew:
    name: Bump Homebrew Formula
    # Runs after the binaries are uploaded, so they exist to hash.
    # To make Homebrew track stable releases only, change this to
    #   needs: [classify, upload-binaries]
    # and add:  if: needs.classify.outputs.prerelease == 'false'
    needs: upload-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Compute version (strip leading v)
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: Kanishk2207/homebrew-filo
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Regenerate formula with new version and checksums
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/Kanishk2207/filo/releases/download/v${VERSION}"
          # Download each platform archive and compute its sha256 directly,
          # which is exactly the value Homebrew verifies against.
          get_sha() {
            curl -fsSL "${base}/filo-v${VERSION}-$1.tar.gz" | sha256sum | awk '{print $1}'
          }
          SHA_MAC_ARM="$(get_sha aarch64-apple-darwin)"
          SHA_MAC_X86="$(get_sha x86_64-apple-darwin)"
          SHA_LIN_ARM="$(get_sha aarch64-unknown-linux-gnu)"
          SHA_LIN_X86="$(get_sha x86_64-unknown-linux-gnu)"

          cat > tap/Formula/filo-rs.rb <<EOF
          class FiloRs < Formula
            desc "Your Downloads folder cleans itself — safely, predictably, and reversibly"
            homepage "https://github.com/Kanishk2207/filo"
            version "${VERSION}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_arm do
                url "https://github.com/Kanishk2207/filo/releases/download/v#{version}/filo-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              end
              on_intel do
                url "https://github.com/Kanishk2207/filo/releases/download/v#{version}/filo-v#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_X86}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/Kanishk2207/filo/releases/download/v#{version}/filo-v#{version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LIN_ARM}"
              end
              on_intel do
                url "https://github.com/Kanishk2207/filo/releases/download/v#{version}/filo-v#{version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LIN_X86}"
              end
            end

            def install
              bin.install "filo"
            end

            test do
              assert_match "filo", shell_output("#{bin}/filo --version")
            end
          end
          EOF

      - name: Commit and push to tap
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/filo-rs.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date — nothing to commit."
          else
            git commit -m "filo-rs ${VERSION}"
            git push
          fi

  bump-scoop:
    name: Bump Scoop Manifest
    # Same gating note as bump-homebrew applies if you want stable-only.
    needs: upload-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Compute version (strip leading v)
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout Scoop bucket
        uses: actions/checkout@v7
        with:
          repository: Kanishk2207/scoop-filo
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop

      - name: Regenerate manifest with new version and checksum
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/Kanishk2207/filo/releases/download/v${VERSION}"
          HASH="$(curl -fsSL "${base}/filo-v${VERSION}-x86_64-pc-windows-msvc.zip" | sha256sum | awk '{print $1}')"
          mkdir -p scoop/bucket
          # In the JSON, \$version is left literal so Scoop's own autoupdate can
          # resolve it later; ${VERSION} and ${HASH} are filled in now.
          cat > scoop/bucket/filo.json <<EOF
          {
              "version": "${VERSION}",
              "description": "Your Downloads folder cleans itself — safely, predictably, and reversibly.",
              "homepage": "https://github.com/Kanishk2207/filo",
              "license": "MIT OR Apache-2.0",
              "architecture": {
                  "64bit": {
                      "url": "${base}/filo-v${VERSION}-x86_64-pc-windows-msvc.zip",
                      "hash": "${HASH}"
                  }
              },
              "bin": "filo.exe",
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/Kanishk2207/filo/releases/download/v\$version/filo-v\$version-x86_64-pc-windows-msvc.zip"
                      }
                  }
              }
          }
          EOF

      - name: Commit and push to bucket
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cd scoop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/filo.json
          if git diff --cached --quiet; then
            echo "Manifest already up to date — nothing to commit."
          else
            git commit -m "filo ${VERSION}"
            git push
          fi

  windows-installer:
    name: Build Windows Installer (.msi)
    needs: release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-wix
        run: cargo install cargo-wix

      # Generates wix/main.wxs from Cargo.toml metadata. The default template
      # installs filo.exe to Program Files and adds it to the system PATH.
      # (If you later want a custom EULA/icon, commit a hand-edited wix/main.wxs
      # and drop this step.)
      - name: Initialize WiX config
        run: cargo wix init --force

      - name: Build MSI
        run: cargo wix --nocapture

      # A version-less copy so the README can link a permanent download URL:
      # https://github.com/.../releases/latest/download/filo-x86_64.msi
      - name: Create stable-named alias
        shell: bash
        run: cp target/wix/*.msi target/wix/filo-x86_64.msi

      - name: Upload MSI to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.classify.outputs.tag }}
          files: |
            target/wix/filo-rs-*.msi
            target/wix/filo-x86_64.msi
